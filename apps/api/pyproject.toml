[project]
name = "adaptlearn-api"
version = "0.1.0"
description = "FastAPI production skeleton for AdaptLearn Student Web."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "supabase>=2.6.0",
  "openai>=1.40.0"
]

[project.optional-dependencies]
ops = [
  "psycopg[binary]>=3.2.0"
]
test = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
